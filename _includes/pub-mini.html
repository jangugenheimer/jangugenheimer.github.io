{% assign p = include.pub %}{% if p %}
<a class="mini" href="https://doi.org/{{ p.doi }}" target="_blank" rel="noopener">
<span class="mini-thumb">{% if p.image %}<img src="{{ p.image | relative_url }}" alt="" loading="lazy">{% endif %}</span>
<span class="mini-text"><span class="venue">{{ p.venue }}{% if p.award %} · {{ p.award }}{% endif %}</span><span class="mini-title">{{ p.title }}</span></span>
</a>
{% endif %}
