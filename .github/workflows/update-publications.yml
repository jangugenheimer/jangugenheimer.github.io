# Monthly (and on demand): pull new publications from Scholar, teaser images, and ACM videos,
# then commit the changes. Scholar sometimes blocks GitHub's servers; the job then simply
# changes nothing, and you can run the scripts on your own computer instead.
name: Update publications
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/update_from_scholar.py --limit 20 || true
      - run: python scripts/fetch_acm_videos.py || true
      - run: |
          git config user.name "publication-bot"
          git config user.email "actions@github.com"
          git add _data assets/papers assets/videos
          git diff --cached --quiet || git commit -m "Update publications"
          git push
